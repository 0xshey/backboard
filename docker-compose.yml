# Backboard on a NAS: the web app plus a pipeline container that refreshes the
# data on a schedule. Both share one data volume. See docs/self-hosting.md.
services:
  app:
    build: .
    image: backboard-app
    ports:
      - "3000:3000"
    environment:
      DATA_DIR: /data
      DATA_SEASON: "2026-27" # must match the pipeline's SEASON
    volumes:
      - backboard-data:/data:ro
    restart: unless-stopped

  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    image: backboard-pipeline
    environment:
      TZ: America/New_York # timezone for the cron expressions below
      SEASON: "2027" # ESPN season id: the year the season ends (2027 = 2026-27)
      CRON_FULL: "15 6 * * *" # everything, daily 06:15 (after late West Coast games)
      CRON_INJURIES: "5 * * * *" # injuries only, hourly at :05 (blank to disable)
      HEALTHCHECK_URL: "" # optional, e.g. https://hc-ping.com/<uuid>
      SUPABASE_URL: ${SUPABASE_URL:-} # optional, for ESPN → NBA.com headshot ids
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    volumes:
      - backboard-data:/data
    restart: unless-stopped

volumes:
  backboard-data:
